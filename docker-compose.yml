services:
  mysql:
    image: mysql:8.4
    container_name: vera_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: vera_system
      MYSQL_USER: vera_user
      MYSQL_PASSWORD: vera_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vera-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uvera_user", "-pvera_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  vera-mat:
    build:
      context: ./backend
      args:
        SERVICE_MODULE: vera-food-service
    container_name: vera_mat
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/vera_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    ports:
      - "8081:8080"
    networks:
      - vera-network
    depends_on:
      mysql:
        condition: service_healthy

  vera-alkohol:
    build:
      context: ./backend
      args:
        SERVICE_MODULE: vera-alcohol-service
    container_name: vera_alkohol
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/vera_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    ports:
      - "8082:8080"
    networks:
      - vera-network
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: vera_frontend
    ports:
      - "80:80"
    networks:
      - vera-network
    depends_on:
      - vera-mat
      - vera-alkohol

networks:
  vera-network:
    driver: bridge

volumes:
  mysql_data:
